[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iplan-dicom"
version = "0.1.0"
description = "Local iPlan XBrain case converter with explicit source verification"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.14,<2", "pydicom>=2.4,<4", "Pillow>=10", "scikit-image>=0.24"]

[project.optional-dependencies]
test = ["pytest>=8", "scikit-image>=0.24"]

[project.scripts]
iplan-dicom = "iplan_dicom.__main__:main"

[tool.setuptools.packages.find]
include = ["iplan_dicom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
